<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HomebrewCon Keg Label Ordering</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0f0f10;
            color: #f5f5f5;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow: hidden;
        }

        .background-glow {
            position: absolute;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(180, 0, 0, 0.35) 0%, rgba(180, 0, 0, 0) 70%);
            filter: blur(40px);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 700px;
            width: 100%;
            background: rgba(20, 20, 22, 0.92);
            border: 1px solid #2d2d2f;
            border-top: 4px solid #c1121f;
            border-radius: 18px;
            padding: 4rem 3rem;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
        }

        .tag {
            display: inline-block;
            background: rgba(193, 18, 31, 0.15);
            color: #ff6b6b;
            border: 1px solid rgba(255, 107, 107, 0.25);
            padding: 0.5rem 1rem;
            border-radius: 999px;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            line-height: 1.05;
            margin-bottom: 1.25rem;
            font-weight: 800;
        }

        .accent {
            color: #e63946;
        }

        p {
            color: #b5b5b8;
            font-size: 1.1rem;
            line-height: 1.7;
            max-width: 560px;
            margin: 0 auto 2rem;
        }

        .divider {
            width: 80px;
            height: 4px;
            background: #c1121f;
            border-radius: 999px;
            margin: 2rem auto;
        }

        .notify {
            display: inline-block;
            text-decoration: none;
            background: #c1121f;
            color: white;
            padding: 1rem 1.75rem;
            border-radius: 12px;
            font-weight: bold;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .notify:hover {
            background: #e63946;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(230, 57, 70, 0.35);
        }

        .footer {
            margin-top: 2.5rem;
            color: #666;
            font-size: 0.9rem;
        }

        @media (max-width: 640px) {
            .container {
                padding: 3rem 1.5rem;
            }

            p {
                font-size: 1rem;
            }
        }

         .logo-container {
     display: flex;
     justify-content: center;
 }

 .logo-container img {
     /* max-height: 200px; */
     max-width: 150px;
     height: auto;
     width: auto;
 }
    </style>
</head>

<body>

    <div class="background-glow"></div>
    <div class="container">
        <div class="tag">Coming Soon</div>
        <div class="logo-container">
            <img src="./HBC-Logo.svg" alt="HBC Logo">
            <img src="https://www.grogtag.com/-1015630644/Handler/CSSOverride/GetImage/6/grogtag-logo.svg"
                alt="GrogTag Logo">
        </div>

        <h1>
            HomebrewCon<br>
            <span class="accent">Keg Label Ordering</span>
        </h1>

        <div class="divider"></div>

        <p>
            Custom keg label ordering for HomebrewCon is currently being prepared.
            Soon you'll be able to place orders directly online.
        </p>

        <div class="footer">
            Powered by GrogTag - Launching soon
        </div>
    </div>

</body>
</html>
